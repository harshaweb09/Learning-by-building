<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | QR code component</title>
    <meta property="og:title" content="Frontend Mentor | QR code component" />
    <meta
      property="og:description"
      content="A QR code component built with HTML and CSS."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://harshaweb09.github.io/Learning-by-building/day-1-qr-code-component/"
    />
    <meta
      property="og:image"
      content="https://harshaweb09.github.io/Learning-by-building/day-1-qr-code-component/preview.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="card">
      <img
        src="./images/image-qr-code.png"
        alt="QR code to visit frontend mentor"
      />
      <h1>Improve your front-end skills by building projects</h1>
      <p>
        Scan the QR code to visit Frontend Mentor and take your coding skills to
        the next level
      </p>
    </div>
  </body>
</html>
