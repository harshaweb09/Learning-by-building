<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Blog preview card built using HTML & CSS"
    />
    <meta property="og:title" content="Frontend Mentor | Blog preview card" />
    <meta
      property="og:description"
      content="Blog preview card built using HTML & CSS"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://harshaweb09.github.io/Learning-by-building/day-1-blog-preview-card/"
    />
    <meta
      property="og:image"
      content="https://harshaweb09.github.io/Learning-by-building/day-1-blog-preview-card/preview.jpg"
    />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <img
          class="card-img"
          src="./assets/images/illustration-article.svg"
          alt="Blog header graphic"
        />
        <p><span class="card-tag">Learning</span></p>
        <p class="card-date">
          Published <time datetime="2023-12-21">21 Dec 2023</time>
        </p>
        <h1 class="card-title">HTML & CSS foundations</h1>
        <p class="card-body">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <footer class="card-author">
          <img
            src="./assets/images/image-avatar.webp"
            alt="Greg Hooper"
            class="author-avathar"
          />
          <span class="author-name">Greg Hooper</span>
        </footer>
      </article>
    </main>
  </body>
</html>
